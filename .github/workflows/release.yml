name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build MSI installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          powershell -ExecutionPolicy Bypass -File .\scripts\package-adbmanager.ps1 `
            -ProjectDir . `
            -Target windows `
            -Arch x64 `
            -Package installer `
            -StartMenu `
            -OutputDir ".\release-$version"

          Copy-Item `
            -LiteralPath ".\release-$version\windows-x64-msi\ADB Manager-$version.msi" `
            -Destination ".\release-$version\ADB-Manager-$version-windows-x64.msi" `
            -Force

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: ADB Manager ${{ github.ref_name }}
          prerelease: true
          body: |
            ## ADB Manager ${{ github.ref_name }}

            Prerelease centrada en la pestaña Control y en nuevos ajustes de rotación del dispositivo.

            - Control: nuevo ajuste de rotación automática mediante ADB.
            - Control: bloqueo manual de orientación en vertical, horizontal derecha, vertical invertida y horizontal izquierda.
            - Control: la rotación automática usa un toggle visual coherente con el modo oscuro.
            - Control: los modos manuales usan iconos descriptivos, con estado deshabilitado más claro cuando la rotación automática está activa.

            Incluye instalador MSI para Windows x64 compatible con la actualización desde versiones anteriores.
          files: release-*/ADB-Manager-*-windows-x64.msi
